name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # plugin.yaml declares no python_dependencies. The settings-page tests use
      # FastAPI and its test client (Hermes provides FastAPI at run time); the
      # workflow test reads this file with PyYAML.
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check pytest fastapi httpx pyyaml
      - name: Run plugin tests
        run: python -B -m pytest tests -q -p no:cacheprovider

  desktop-tests:
    name: Desktop tests on Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run desktop tests
        run: node --import ./desktop/tests/sdk-shim.mjs --test desktop/tests/*.test.mjs
